[package]
name = "xbar"
version = "0.1.0"
edition = "2021"

[dependencies]
libc = "0.2"
libpulse-binding = "2.30"
futures-lite = "2"
async-io = "2"
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
x11rb = { version = "0.14", features = ["allow-unsafe-code", "randr"] }
x11 = { version = "2.21", features = ["xlib", "xft"] }
zbus = { version = "5", default-features = false, features = ["async-io"] }
xnm = { path = "crates/xnm" }
