[package]
name = "xbar"
version = "0.1.0"
edition = "2021"

[workspace]
members = [
    "crates/xbar-sni-watcher",
    "crates/xbar-ai-protocol",
    "crates/xbar-ai-usage",
]
exclude = ["crates/xnm"]
resolver = "2"

[dependencies]
libc = "0.2"
libpulse-binding = "2.30"
futures-lite = "2"
async-io = "2"
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
x11rb = { version = "0.14", features = ["allow-unsafe-code", "randr", "render", "xinput"] }
x11 = { version = "2.21", features = ["xlib", "xft"] }
zbus = { version = "5", default-features = false, features = ["async-io"] }
xnm = { path = "crates/xnm" }
xbar-ai-protocol = { path = "crates/xbar-ai-protocol" }

[patch.crates-io]
libpulse-binding = { path = "vendor/libpulse-binding" }
libpulse-sys = { path = "vendor/libpulse-sys" }
